# =============================================================================
# ci.yml – Build and push the rover Docker image to Azure Container Registry
#
# Triggers:
#   • Push to main / master (build + push)
#   • Pull request against main / master (build only, no push)
#   • Manual dispatch (workflow_dispatch)
#
# Required GitHub secrets:
#   ACR_LOGIN_SERVER   – e.g. mylzregistry.azurecr.io
#   ACR_USERNAME       – Service principal app ID or ACR admin username
#   ACR_PASSWORD       – Service principal secret or ACR admin password
# =============================================================================
name: "Build & Push Rover Container"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: azure-lz-rover

jobs:
  build-and-push:
    name: "Build${{ github.event_name != 'pull_request' && ' & Push' || '' }} Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
